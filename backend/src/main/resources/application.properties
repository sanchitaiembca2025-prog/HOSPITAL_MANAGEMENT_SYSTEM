# ─── Dev (MySQL) ───────────────────────────────────────────────────────────────
spring.profiles.active=dev

spring.application.name=hospital-management

# ─── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ─── File storage ──────────────────────────────────────────────────────────────
hms.file.storage-path=${user.home}/hms/uploads

# ─── Multipart uploads ─────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT ───────────────────────────────────────────────────────────────────────
# Override in application-dev / application-prod
hms.jwt.secret=CHANGE_ME_USE_256BIT_BASE64_ENCODED_SECRET_IN_ENV
hms.jwt.expiration-ms=86400000
